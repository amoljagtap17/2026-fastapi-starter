[project]
name = "fastapi-starter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Amol Jagtap", email = "amoljagtap17@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.142.2",
    "passlib>=1.7.4",
    "sqlalchemy>=2.1.4",
]

[project.scripts]
fastapi-starter = "fastapi_starter:main"

[tool.fastapi]
# entrypoint = "fastapi_starter:app"
# entrypoint = "fastapi_oop:app"
entrypoint = "fastapi_todos_app.main:app"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
